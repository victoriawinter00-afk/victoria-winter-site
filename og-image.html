<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image</title>
    <style>
        /* Use exact colors from variables.css */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* Neutral outside border */
            font-family: 'Georgia', 'Times New Roman', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Main Box */
        .og-box {
            width: 1200px;
            height: 630px;
            background-color: #b8c9e0; /* var(--color-primary) */
            border: 4px solid #d9c8d9; /* var(--color-border) */
            border-radius: 0px; /* Keep it a sharp box like your drawing */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            color: #062301; /* var(--color-text) */
        }

        /* Title Box */
        .og-title {
            background-color: #F2D9F2; /* var(--color-accent) */
            border: 1px solid #d9c8d9;
            padding: 20px 40px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        /* Subtitle */
        .og-subtitle {
            background-color: #fcfdd6; /* var(--color-accent) */
            border: 1px solid #d9c8d9;
            padding: 20px 40px;
            border-radius: 6px;
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* Body Text */
        .og-description {
            background-color: #d2ffcd; /* var(--color-accent) */
            border: 1px solid #d2ffcd;
            padding: 20px 35px;
            border-radius: 6px;
            font-size: 26px;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto 40px auto;
        }

        /* URL */
        .og-url {
            background-color: #d2ffcd; /* var(--color-accent) */
            border: 1px solid #d2ffcd;
            padding: 20px 40px;
            border-radius: 6px;
            font-size: 30px;
            font-weight: 600;
            color: #051d00;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="og-box">
        <div class="og-title">Victoria Winter</div>
        <div class="og-subtitle">Administrative and Managerial Consultant</div>
        <div class="og-description">
            I help people become owners and help owners scale business. 
            Let's build something.
        </div>
        <div class="og-url">www.victoriawinter00.com</div>
    </div>

</body>
</html>
