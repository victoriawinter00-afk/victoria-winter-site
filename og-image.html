<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #d9f2fb;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Main Box */
        .og-box {
            width: 1200px;
            height: 630px;
            background: linear-gradient(180deg, #d9f2fb 0%, #fffafb 68%, #f5a9b8 68%, #f5a9b8 100%);
            border: 4px solid #1d2d2a;
            border-radius: 28px;
            box-sizing: border-box;
            display: flex;
            flex-shrink: 0;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            color: #1d2d2a;
        }

        /* Title Box */
        .og-title {
            background-color: #fffafb;
            border: 2px solid #1d2d2a;
            padding: 20px 40px;
            border-radius: 18px;
            margin-bottom: 20px;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        /* Subtitle */
        .og-subtitle {
            background-color: #fffafb;
            border: 2px solid #e58fa2;
            padding: 20px 40px;
            border-radius: 18px;
            font-size: 30px;
            font-weight: 400;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* Body Text */
        .og-description {
            background-color: #fffafb;
            border: 2px solid #5bc8e8;
            padding: 20px 35px;
            border-radius: 18px;
            font-size: 26px;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto 40px auto;
        }

        /* URL */
        .og-url {
            background-color: #f5a9b8;
            border: 2px solid #1d2d2a;
            padding: 20px 40px;
            border-radius: 18px;
            font-size: 30px;
            font-weight: 600;
            color: #051d00;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="og-box">
        <div class="og-title">Victoria Winter</div>
        <div class="og-subtitle">Administrative and Managerial Consultant</div>
        <div class="og-description">
            Practical support for forms, filings, and operations.<br>
            Clear, calm help for your next business step.
        </div>
        <div class="og-url">www.victoriawinter00.com</div>
    </div>

</body>
</html>
